<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="逃離日常凝聚營：認識每一位參加者，收藏一起跨出的每一步。" />
  <meta name="theme-color" content="#66c9f2" />
  <title>逃離日常｜凝聚營回顧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Shippori+Mincho:wght@600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20261109e" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js" defer></script>
  <script src="script.js?v=20261109h" defer></script>
</head>

<body>
  <a class="skip-link" href="#main">跳至主要內容</a>

  <header class="site-header">
    <a class="brand" href="#top" aria-label="回到頁首">逃離日常</a>
    <nav aria-label="主要導覽">
      <a href="#participants">參加者</a>
      <a href="#memories">活動照片</a>
    </nav>
  </header>

  <main id="main">
    <section class="hero" id="top" aria-labelledby="hero-title">
      <div class="hero-layer hero-glow glow-one" aria-hidden="true"></div>
      <div class="hero-layer hero-glow glow-two" aria-hidden="true"></div>
      <div class="hero-layer contour contour-one" aria-hidden="true"></div>
      <div class="hero-layer contour contour-two" aria-hidden="true"></div>

      <div class="hero-content">
        <h1 id="hero-title" data-site-title>逃離日常</h1>
        <p class="hero-subtitle" data-site-subtitle>多認識一個人，多跨出一步，多留下一段回憶，一起玩，也一起成為更靠近的團契</p>
        <a class="scroll-cue" href="#participants"><span>認識這次同行的人</span><i aria-hidden="true">↓</i></a>
      </div>

      <div class="hero-photo-wrap" aria-hidden="true">
        <img data-site-cover src="img/cover.jpg" alt="" />
      </div>
    </section>

    <section class="participants" id="participants" aria-labelledby="participants-title">
      <header class="participants-intro section-pad">
        <div>
          <h2 id="participants-title">因為有你們<br />這趟旅程更完整。</h2>
        </div>
        <p>一群願意離開熟悉位置、一起跨出一步的人。</p>
      </header>

      <div class="participant-list" data-participants aria-live="polite" aria-busy="true"></div>
      <p class="load-error" data-load-error hidden>資料載入失敗，請使用本機伺服器或 GitHub Pages 開啟網站。</p>
    </section>

    <section class="memories" id="memories" aria-labelledby="memories-title">
      <header class="memories-heading section-pad">
        <h2 id="memories-title">一起走過的片段，<br />還在繼續往前。</h2>
      </header>

      <div class="photo-marquee" aria-label="活動照片跑馬燈">
        <div class="photo-track" data-photo-track></div>
      </div>

      <div class="closing section-pad">
        <p>回到日常以後，別忘了我們曾經一起跨出的那一步。</p>
        <a href="#top">再看一次 ↑</a>
      </div>
    </section>
  </main>

  <footer>
    <strong>逃離日常</strong>
    <span>Fellowship Camp · <span data-current-year>2026</span></span>
  </footer>
</body>

</html>
